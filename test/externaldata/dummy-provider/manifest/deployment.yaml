apiVersion: apps/v1
kind: Deployment
metadata:
  name: approvals-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      run: approvals-validator
  template:
    metadata:
      labels:
        run: approvals-validator
    spec:
      containers:
      - image: yingruitestacr.azurecr.io/test/gatekeeperprovider:0.0.11
        imagePullPolicy: IfNotPresent
        name: approvals-validator
        ports:
        - containerPort: 8090
          protocol: TCP
        volumeMounts:
        - name: gatekeeper-ca-cert
          mountPath: /tmp/gatekeeper
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: gatekeeper-ca-cert
        secret:
          secretName: gatekeeper-webhook-server-cert
          items:
          - key: ca.crt
            path: ca.crt
